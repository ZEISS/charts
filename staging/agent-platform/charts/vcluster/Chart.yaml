apiVersion: v2
name: vcluster-tenant
description: >-
  Reusable wrapper around the official vCluster Helm chart to provision one
  isolated tenant cluster per team, pre-wired (via service replication) to
  reach the ZAP Agentgateway control plane at a stable in-cluster address.
type: application
version: 0.1.0
appVersion: "0.37.1"
keywords:
  - vcluster
  - multi-tenancy
home: https://www.vcluster.com
sources:
  - https://github.com/loft-sh/vcluster
dependencies:
  - name: vcluster
    version: "0.37.1"
    repository: https://charts.loft.sh
