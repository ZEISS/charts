# Namespace defines the namespace in which the agentgateway platform will be installed.
namespace: agentgateway-system

# Toggle installing the agentgateway CRDs via this chart's dependency. Set to
# false if they are already installed cluster-wide (e.g. shared across
# multiple environments/releases) to avoid Helm re-managing cluster-scoped
# CRDs from more than one release.
agentgatewayCrds:
  enabled: true

# Values passed through to the upstream `agentgateway` control-plane subchart
# (oci://cr.agentgateway.dev/charts/agentgateway). Left empty to use its
# defaults for the PoC; see https://agentgateway.dev for the full reference.
agentgateway: {}

gateway:
  name: agentgateway-proxy
  gatewayClassName: agentgateway
  port: 80

llm:
  # Default backend for the PoC: llm-d's inference simulator. It speaks the
  # real vLLM/OpenAI wire protocol (incl. token accounting) without needing a
  # GPU or a provider API key.
  simulator:
    enabled: true
    image: ghcr.io/llm-d/llm-d-inference-sim:v0.3.0
    model: meta-llama/Llama-3.1-8B-Instruct
    port: 8000

  # Optional: route LLM traffic to a real, OpenAI-compatible provider.
  hosted:
    enabled: false
    model: qwen2.5-8b-instruct
    # Leave host/port empty to use the provider's public hosted endpoint
    # (e.g. api.openai.com). Set both to point at a self-hosted
    # OpenAI-compatible endpoint instead (like the simulator above).
    host: ""
    port: ""
    route: /openai-hosted
    # Secret (in `namespace`) holding the `Authorization` header value used
    # to call the provider. See secretName/apiKey below.
    secretName: openai-secret
    # If set, this chart creates `secretName` with this value. Leave empty
    # and pre-create the Secret yourself for anything beyond a throwaway PoC
    # (never commit real keys into values files!).
    createSecret: true
    apiKey: ""

# Policies for the Gateway that apply to all routes (LLM, MCP, A2A).
policies:
  # API-key authentication enforced at the Gateway, covering every route
  # (LLM, MCP, A2A) for every team.
  auth:
    enabled: true
  # Team-attributed usage metrics (adds a `team` label to every gateway
  # metric based on the caller's API key metadata).
  metrics:
    enabled: true
