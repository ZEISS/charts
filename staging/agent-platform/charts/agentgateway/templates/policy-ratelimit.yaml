{{- range .Values.teams }}
{{- if .rateLimit.enabled }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ .name }}-token-budget
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "agentgateway-platform.labels" $ | nindent 4 }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ .name }}-llm
  traffic:
    rateLimit:
      local:
      - tokens: {{ .rateLimit.tokens }}
        unit: {{ .rateLimit.unit }}
{{- end }}
{{- end }}
